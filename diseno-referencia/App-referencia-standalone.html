  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

M Plex Sans';color:var(--ink)\">{{ p.texto }}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<div style=\"display:flex;align-items:center;gap:8px;margin-top:12px;font:500 12px 'IBM Plex Sans';color:var(--warn)\"><span style=\"width:12px;height:12px;border-radius:4px;background:var(--warn)\"><\u002Fspan>Los pasos en ámbar son críticos de seguridad.<\u002Fdiv>\n<div style=\"margin-top:12px;font:400 11.5px/1.5 'IBM Plex Sans';color:var(--ink-3)\">Fuente: Manual WEG SSW-05 Plus · puesta en marcha · revisión pendiente<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ secFallas }}\">\n<p style=\"margin:2px 0 14px;font:400 13.5px/1.5 'IBM Plex Sans';color:var(--ink-2)\">Fallas cargadas para este modelo. Tocá un código para ver qué significa y cómo resolverlo.<\u002Fp>\n<div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n<sc-for list=\"{{ fallaChips }}\" as=\"f\" hint-placeholder-count=\"6\">\n<button onclick=\"{{ f.on }}\" style=\"border:1px solid var(--border-2);background:var(--surface);color:var(--code);border-radius:10px;padding:10px 15px;font:600 15px 'IBM Plex Mono',monospace\">{{ f.code }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button onclick=\"{{ h.goFallas }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:13px;border:none;border-radius:12px;background:var(--brand);color:#fff;font:600 15px 'IBM Plex Sans'\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16.5\" y1=\"16.5\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg>Abrir buscador de fallas<\u002Fbutton>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCalc }}\">\n<div style=\"padding:60px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:60vh;justify-content:center\">\n<span style=\"color:var(--border-2); 02Fp>\n\n<div style=\"font:600 11px 'IBM Plex Sans';letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px\">Respaldo<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:22px\">\n<button style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:13px\">\n<span style=\"color:var(--brand-2);display:flex\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12M8 11l4 4 4-4\"><\u002Fpath><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"flex:1\"><span style=\"display:block;font:600 15px 'IBM Plex Sans';color:var(--ink)\">Exportar catálogo<\u002Fspan><span style=\"display:block;font:400 12px 'IBM Plex Sans';color:var(--ink-3);margin-top:1px\">Guardar respaldo en un archivo<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<button style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:13px\">\n<span style=\"color:var(--brand-2);display:flex\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V3M8 7l4-4 4 4\"><\u002Fpath><path d=\"M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"flex:1\"><span style=\"display:block;font:600 15px 'IBM Plex Sans';color:var(--ink)\">Importar respaldo<\u002Fspan><span style=\"display:block;font:400 12px 'IBM Plex Sans';color:var(--ink-3);margin-top:1px\">Restaurar desde un archivo<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"padding:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;text-align:center\">\n<div style=\"font:600 14px 'IBM Plex Sans';color:var(--ink)\">JGM Servicios · Arrancadores<\u002Fdiv>\n<div style=\"font:400 12px 'IBM Plex Mono',monospace;color:var(--ink-3);margin-top:4px\">v0.1 · funciona sin conexión<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<nav style=\"flex:none;display:flex;align-items:stretch;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)\">\n<button onclick=\"{{ h.goInicio }}\" style=\"flex:1;border:none;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ tab.inicio }}\"><svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 11l8-7 8 7\"><\u002Fpath><path d=\"M6 10v9h12v-9\"><\u002Fpath><\u002Fsvg><span style=\"font:600 10.5px 'IBM Plex Sans'\">Inicio<\u002Fspan><\u002Fbutton>\n<button onclick=\"{{ h.goCatalogo }}\" style=\"flex:1;border:none;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ tab.catalogo }}\"><svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><\u002Fsvg><span style=\"font:600 10.5px 'IBM Plex Sans'\">Catálogo<\u002Fspan><\u002Fbutton>\n<button onclick=\"{{ h.goFallas }}\" style=\"flex:1;border:none;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ tab.fallas }}\"><svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 2 20h20L12 3z\"><\u002Fpath><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"17.2\"><\u002Fline><\u002Fsvg><span style=\"font:600 10.5px 'IBM Plex Sans'\">Fallas<\u002Fspan><\u002Fbutton>\n<button onclick=\"{{ h.goCalc }}\" style=\"flex:1;border:none;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ tab.calc }}\"><svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"4\" y1=\"8\" x2=\"20\" y2=\"8\"><\u002Fline><circle cx=\"9\" cy=\"8\" r=\"2.6\" fill=\"var(--surface)\"><\u002Fcircle><line x1=\"4\" y1=\"16\" x2=\"20\" y2=\"16\"><\u002Fline><circle cx=\"15\" cy=\"16\" r=\"2.6\" fill=\"var(--surface)\"><\u002Fcircle><\u002Fsvg><span style=\"font:600 10.5px 'IBM Plex Sans'\">Calc.<\u002Fspan><\u002Fbutton>\n<button onclick=\"{{ h.goAjustes }}\" style=\"flex:1;border:none;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ tab.ajustes }}\"><svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1\"><\u002Fpath><\u002Fsvg><span style=\"font:600 10.5px 'IBM Plex Sans'\">Ajustes<\u002Fspan><\u002Fbutton>\n<\u002Fnav>\n\n<sc-if value=\"{{ splash }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--brand);animation:jgmFade .3s ease .85s forwards\">\n<div style=\"width:112px;height:112px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.28);overflow:hidden\"><img src=\"5a78ed49-c028-4e63-aa68-877b587e6537\" alt=\"JGM Servicios\" style=\"width:100%;height:100%;object-fit:contain\"><\u002Fdiv>\n<div style=\"text-align:center\">\n<div style=\"font:700 20px 'IBM Plex Sans';color:#fff;letter-spacing:.01em\">JGM Arrancadores<\u002Fdiv>\n<div style=\"font:400 12.5px 'IBM Plex Mono',monospace;color:rgba(255,255,255,.75);margin-top:5px\">Guía de campo · sin conexión<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:860},&quot;defaultVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;,&quot;C&quot;],&quot;default&quot;:&quot;B&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inicio&quot;},&quot;showReviewBar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Revisión&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    variant: this.props.defaultVariant || 'B',\n    fs: 'md',\n    screen: 'inicio',\n    code: '',\n    result: undefined,\n    fichaSec: 'datos',\n    borne: null,\n    splash: true\n  };\n\n  componentDidMount() {\n    let seen = false;\n    try { seen = !!sessionStorage.getItem('jgm_splash_seen'); } catch (e) {}\n    if (seen) { this.setState({ splash: false }); return; }\n    this._t = setTimeout(() => {\n      this.setState({ splash: false });\n      try { sessionStorage.setItem('jgm_splash_seen', '1'); } catch (e) {}\n    }, 1150);\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  faults = {\n    '72': { code: 'E72', titulo: 'Sobrecorriente antes del by-pass', led: 'Internal Fault · 4 parpadeos',\n      signi
